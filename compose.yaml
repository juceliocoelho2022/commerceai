services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: commerceai
      POSTGRES_USER: commerceai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-commerceai_dev}
    volumes:
      - commerceai_postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceai -d commerceai"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/commerceai
      DB_USER: commerceai
      DB_PASSWORD: ${DB_PASSWORD:-commerceai_dev}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  commerceai_postgres:
